# ScalpTrack default configuration.
# All paths are relative to the project root. Notebooks and scripts load this
# file through scalptrack.config.load_config(); never hard-code absolute paths.

schema_version: "1.0"
seed: 42

paths:
  raw: data/raw
  manifests: data/manifests
  derived: data/derived
  synthetic: data/synthetic
  models: models
  figures: outputs/figures
  results: outputs/results
  demo: outputs/demo
  reports: reports

# --- Dataset sources (spec Section 4). Only linked public sources are used. ---
datasets:
  primary: kaggle_hair_diseases
  sources:
    kaggle_hair_diseases:
      dir: data/raw/kaggle_hair_diseases
      url: https://www.kaggle.com/datasets/sundarannamalai/hair-diseases
      version: "1"
      license: CC BY-NC-SA 4.0
      task_type: image_classification
      layout: split_class_folders     # <root>/<split>/<class>/<image>
      split_aliases: {train: train, val: validation, valid: validation, validation: validation, test: test}
      healthy_dir: Hair Diseases - Final/healthy_hair   # optional, user-added healthy-scalp photos (not part of the Kaggle
                                                       # download); used by scripts/train_deep.py, skipped by the audit
    maheshwariss_hair_and_scalp:
      dir: data/raw/maheshwariss_hair_and_scalp
      url: https://universe.roboflow.com/maheshwariss-workspace-nn7d1/hair-and-scalp-w3ih8
      version: null                  # fill in the Roboflow export version you downloaded
      license: CC BY 4.0
      task_type: region_classification
      layout: yolo                    # Roboflow "YOLOv8" export: <split>/images, <split>/labels, data.yaml
    litmers_scalp:
      dir: data/raw/litmers_scalp
      url: https://universe.roboflow.com/litmers-cwywf/scalp-bo6xy
      version: null
      license: CC BY 4.0
      task_type: demonstration_only   # 37 images / 10 labels: supplementary demos, not a classifier
      layout: yolo

image:
  supported_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]
  min_side_px: 32

quality:
  blur_laplacian_var_min: 60.0      # empirical development choice, not a universal cutoff
  dark_level: 20
  bright_level: 245
  dark_fraction_max: 0.35
  bright_fraction_max: 0.10
  min_roi_side_px: 64

filters:
  border: reflect101                # one documented boundary policy (cv2.BORDER_REFLECT_101)
  mean_kernels: [3, 5]
  gaussian_kernels: [3, 5]
  gaussian_sigma: 1.0
  median_kernels: [3, 5]
  bilateral: {d: 7, sigma_color: 50, sigma_space: 7}
  laplacian_alpha: 0.5
  laplacian_ksize: 1
  synthetic_noise_sigma: 15.0

edges:
  sobel_ksize: 3
  gradient_threshold_fraction: 0.25  # binarise Sobel/Prewitt at this fraction of max magnitude
  canny_blur_ksize: 5
  canny_blur_sigma: 1.2
  canny_pairs: [[30, 90], [50, 150], [80, 200]]

segmentation:
  fixed_threshold: 90
  adaptive_block_sizes: [15, 31, 51]
  adaptive_c: 8                      # selected in notebook 02 (mean F1 over synthetic development fixtures)
  hair_method: adaptive_gaussian     # chosen on development/synthetic images only
  hair_block_size: 15                # ditto; must be >= ~3x the expected shaft width on real images
  open_kernel: 0                     # 0 disables opening (protects narrow shafts)
  close_kernel: 3
  min_component_area: 30
  flake_bright_percentile: 98.5
  flake_min_area: 6
  flake_max_area: 2000
  flake_max_saturation: 70           # OpenCV uint8 S channel
  shadow_v_max: 25                   # very dark V -> unknown/excluded
  glare_v_min: 250
  glare_s_max: 25

texture:
  levels: 32
  distances: [1, 2, 4]
  angles_deg: [0, 45, 90, 135]
  feature_size: 256                  # classifier feature extraction resizes to this square (INTER_AREA)

pyramids:
  max_levels: 4
  min_side_px: 16

measurements:
  min_component_area: 30
  max_junction_fraction: 0.2         # above this, component count is flagged ambiguous
  shaft_min_elongation: 3.0          # a component that is BOTH compact (elongation < 3) ...
  shaft_min_length_px: 40            # ... AND short (skeleton < 40 px) is not shaft-like (e.g. flake halo)
  crossing_merge_gap_px: 2
  width_exclude_radius_px: 4         # skip skeleton samples near tips/junctions
  min_resolvable_width_px: 4.0
  width_offset_px: 0.0               # width = 2*d - offset; lowest-MAE offset on synthetic fixtures (notebook 04) = spec formula 2*d
  pixel_scale_um_per_px: null        # never guessed; supply with provenance only

stereo:
  num_disparities: 96                # positive multiple of 16
  block_size: 5                      # odd
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  lr_check_tolerance_px: 1.0
  border_px: 8
  error_threshold_px: 1.0
  synthetic:
    width: 480
    height: 360
    focal_px: 500.0
    baseline_mm: 60.0
    units: mm

face:
  cascade_path: null                 # null = OpenCV's bundled cascade; or e.g. assets/haarcascade_frontalface_default.xml
  scale_factor: 1.1
  min_neighbors: 5
  min_size: [40, 40]
  equalize: true

classification:
  task_mode: auto                    # image_classification | region_classification (from audit)
  split_policy: publisher_if_clean   # publisher_if_clean | regroup
  split_fractions: [0.70, 0.15, 0.15]
  near_duplicate_hamming: 6          # stage 1: dHash bits (of 64) under 8 flips/rotations
  near_duplicate_min_corr: 0.7       # stage 2: 32x32 thumbnail correlation to keep a candidate
  near_duplicate_accept_corr: 0.98   # near-identical thumbnails are accepted without stage 3
  near_duplicate_orb_inliers: 25     # stage 3: ORB similarity-transform inliers that confirm a copy (0 = off)
  logreg_C_grid: [0.01, 0.1, 1.0, 10.0]
  rf_n_estimators: 300
  rf_n_jobs: 1                       # single worker = reproducible, works in restricted environments; raise for speed
  class_weight: balanced
  uncertainty_threshold: null        # null = off; "auto" = chosen on VALIDATION (90% keep "predicted")
  max_images_per_class: null         # optional cap for quick CPU runs (applied per split, seeded)
