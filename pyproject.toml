[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalptrack"
version = "1.0.0"
description = "Explainable scalp-condition classification and experimental hair measurement (FCV mini-project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<5",   # OpenCV 5 moved CascadeClassifier out of the main package
    "scipy>=1.13",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyter", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "ipywidgets>=8.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.format]
# Notebook builders hold cell sources in triple-quoted strings; their layout is kept by hand.
exclude = ["scripts/nbbuild/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "UP042", "E731", "E702", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["scalptrack", "nbbuild"]
